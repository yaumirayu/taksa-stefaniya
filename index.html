function title(){state='title';stage=null;camera=0;clock=0;hearts=0;lives=4;levelIndex=0;particles=[];showPanel(`<div class="eyebrow">Нарисованная история о большой любви</div><h1>Стефания и Роман:<br><em>Любовь сильнее мира</em></h1><p>Маленькая такса против большого жестокого города. Между ней и Романом — пропасти, папарацци и крайне сомнительные жизненные советы.</p><div class="storyQuote">«Они обещали, что любовь ничего не исправит. Просто они никогда не встречали Стефанию».</div><div class="introTips"><span class="pill">← → или A / D — идти</span><span class="pill">↑ / W / ПРОБЕЛ — прыгать</span><span class="pill">P — пауза · M — звук</span></div><div class="buttonRow"><button class="btn" id="startBtn">♥ Начать путешествие</button></div><p class="tiny">3 главы · контрольные точки · трогательная анимированная концовка · работает без интернета</p>`);el('startBtn').onclick=()=>{initAudio();showStory(0);};}

function drawEnding(){const t=endingTime;if(t<18)drawReunion(t);else if(t<26)drawMagic(t-18);else if(t<40)drawFlight(t-26);else drawBeach(t-40);drawParticles(0);vignette();}
function showCompleted(){state='completed';skip.style.display='none';endCaption.style.display='none';showPanel(`<div class="eyebrow">Счастливая концовка • Таиланд</div><h2>Любовь сильнее мира ♥</h2><p>Стефания и Роман долетели до Таиланда <strong>своими силами</strong>. Они ели сочный манго и ананасы, смеялись, обнимались на пляже и встречали закаты у океана.</p><div class="storyQuote">«Мир не стал идеальным. Но теперь им было с кем делить каждый рассвет. Иногда это и есть настоящее чудо».</div><p><strong>Всего собрано писем: 💌 ${hearts}</strong></p><div class="buttonRow"><button class="btn" id="replayBtn">♥ Пройти историю заново</button><button class="btn secondary" id="beachBtn">✦ Ещё посмотреть на пляж</button></div><p class="tiny">Спасибо, что помогли любви победить.</p>`);el('replayBtn').onclick=title;el('beachBtn').onclick=()=>{state='ending';endingTime=40;endingPhase=-1;endingTextKey=-1;overlay.classList.add('hidden');skip.style.display='block';};}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#201b33';ctx.fillRect(0,0,canvas.width,canvas.height);if(state==='playing'&&canvas.width/canvas.height<.95){const z=Math.min(screenScale*1.55,canvas.height/H*.75);ctx.setTransform(z,0,0,z,0,(canvas.height-H*z)/2);}else ctx.setTransform(screenScale,0,0,screenScale,offX,offY);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();if(stage&&(state==='playing'||state==='paused'||state==='gameover'||state==='chapterWin'||state==='story'&&levelIndex>0)){bgForLevel(stage.theme,camera,clock);drawStage();vignette();if(state==='playing')drawSpeechHints();}else if(state==='ending'||state==='completed'){drawEnding();}else drawTitleBg(wallClock);ctx.restore();}
let last=0;function tick(now){if(!last)last=now;const dt=Math.min(.034,(now-last)/1000||0);last=now;wallClock+=dt;if(state==='playing'){updateControls();updateGame(dt);}else if(state==='ending')updateEnding(dt);else if(state==='title')clock+=dt;
 if(toastTimeout>0){toastTimeout-=dt;if(toastTimeout<=0)hideToast();}
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.gravity||0)*dt;if(p.life<=0)particles.splice(i,1);}
 music(dt);render();requestAnimationFrame(tick);}
 // Small optional local QA hooks, inert in ordinary gameplay.
 if(new URLSearchParams(location.search).has('qa'))window.__QA={state:()=>({state,levelIndex,lives,hearts,x:player?.x,y:player?.y,onGround:player?.onGround,endingTime}),start:(i=0)=>{lives=4;hearts=0;startLevel(i);},move:x=>{if(player){player.x=x;player.y=groundAt(stage,x)-player.h-8;player.vy=0;}},ending:()=>startEnding(),time:t=>{endingTime=t;endingPhase=-1;},skip:()=>skip.click()};
 title();requestAnimationFrame(tick);
})();
</script>
